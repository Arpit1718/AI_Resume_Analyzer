{% extends "base.html" %}
{% block title %}Sign up · AI Resume Analyzer{% endblock %}
{% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="sub-text">Start your AI career journey.</p>

        {% if error %}
            <p class="form-error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="you@example.com"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Create a password"
                   autocomplete="new-password" minlength="8" required>
            <p class="sub-text">Use at least 8 characters.</p>

            <button type="submit">Create account</button>
        </form>

        <p class="switch-auth">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
